services:
  postgres:
    image: postgres:19
    environment:
      POSTGRES_USER: startodel
      POSTGRES_PASSWORD: startodel
      POSTGRES_DB: startodel
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U startodel -d startodel"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres_data:
